name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-docker:
    name: Validate Docker Compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Docker Compose configuration
        run: |
          docker compose config --quiet

  go-services:
    name: Build & Vet Go Services
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [api-server, webhook-handler, review-worker]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache-dependency-path: services/${{ matrix.service }}/go.sum
      - name: Verify Go Module & Build
        run: |
          cd services/${{ matrix.service }}
          go vet ./...
          go build -v ./...

  python-service:
    name: Python Code Intelligence Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Syntax & Compilation Check
        run: |
          python -m compileall services/code-intelligence

  frontend:
    name: Frontend Build Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies & build
        run: |
          cd frontend
          npm install
          npm run build
